<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Вход — карта скриптов Project Group</title>
  <style>
    :root{--ink:#172033;--muted:#69758b;--blue:#315fe7;--line:#dce3ef;--danger:#b53c3c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--ink);background:radial-gradient(circle at 15% 0,rgba(49,95,231,.16),transparent 34rem),linear-gradient(145deg,#f8faff,#eef2f8);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .card{width:min(430px,100%);padding:30px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 70px rgba(26,38,66,.14)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:27px}.logo{width:46px;height:46px;display:grid;place-items:center;color:#fff;background:var(--blue);border-radius:13px;font-weight:900;box-shadow:0 9px 22px rgba(49,95,231,.26)}.brand strong{display:block}.brand span{display:block;color:var(--muted);font-size:11px}
    .lock{width:52px;height:52px;display:grid;place-items:center;margin-bottom:18px;border-radius:15px;background:#edf2ff;color:var(--blue);font-size:24px}h1{margin:0 0 8px;font-size:27px;letter-spacing:-.035em}p{margin:0 0 22px;color:var(--muted)}label{display:block;margin-bottom:7px;font-size:12px;font-weight:800}.field{position:relative}.field input{width:100%;height:48px;padding:0 48px 0 13px;border:1px solid var(--line);border-radius:11px;outline:none;font:inherit}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,95,231,.11)}.show{position:absolute;right:7px;top:7px;width:35px;height:34px;border:0;border-radius:8px;background:#f1f4f9;cursor:pointer}.submit{width:100%;height:48px;margin-top:12px;border:0;border-radius:11px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer;box-shadow:0 9px 20px rgba(49,95,231,.2)}.submit:hover{background:#244fd0}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;margin:12px 0 0;padding:10px 12px;border:1px solid #f0caca;border-radius:9px;color:var(--danger);background:#fff3f3;font-size:12px}.error.show-error{display:block}.note{margin:18px 0 0;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">PG</div><div><strong>Project Group</strong><span>эталонные скрипты · mind map</span></div></div>
    <div class="lock">⌾</div>
    <h1>Карта защищена</h1>
    <p>Введите общий пароль. Расшифровка произойдёт только в вашем браузере — пароль никуда не отправляется.</p>
    <form id="form">
      <label for="password">Пароль</label>
      <div class="field"><input id="password" type="password" autocomplete="current-password" required autofocus><button class="show" id="show" type="button" aria-label="Показать пароль">◉</button></div>
      <button class="submit" id="submit" type="submit">Открыть карту</button>
      <div class="error" id="error">Пароль не подходит. Проверьте раскладку и попробуйте ещё раз.</div>
    </form>
    <div class="note">AES-256-GCM · данные карты хранятся в зашифрованном виде</div>
  </main>

    const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
    async function decrypt(password){
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password.normalize("NFKC")),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(SALT),iterations:ITERATIONS,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(PAYLOAD));
      return new TextDecoder().decode(plain);
    }
    document.getElementById("show").addEventListener("click",()=>{const input=document.getElementById("password");input.type=input.type==="password"?"text":"password";input.focus()});
    document.getElementById("form").addEventListener("submit",async event=>{
      event.preventDefault();
      const input=document.getElementById("password"),button=document.getElementById("submit"),error=document.getElementById("error");
      error.classList.remove("show-error");button.disabled=true;button.textContent="Расшифровка…";
      try{const page=await decrypt(input.value);document.open();document.write(page);document.close()}
      catch(_){error.classList.add("show-error");input.select();button.disabled=false;button.textContent="Открыть карту"}
